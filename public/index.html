<div class="box" id="shareLink">
  https://sharechat.com/chatroom/88f8a01b-8cd6-42c1-ab7b-f8dbab863670?d=n
</div>

<button class="copy-btn" onclick="copyLink()">
  📋 Copy ShareChat Link
</button>

<script>
const shareURL =
"https://sharechat.com/chatroom/88f8a01b-8cd6-42c1-ab7b-f8dbab863670?d=n";

async function copyLink() {
  await navigator.clipboard.writeText(shareURL);

  const btn = document.querySelector(".copy-btn");
  btn.innerText = "✅ Link Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy ShareChat Link";
  }, 2000);
}
</script>
